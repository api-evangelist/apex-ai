name: Apex.AI
description: >-
  Apex.AI is an embedded and autonomous software company whose tagline is "software
  that moves," focused on safe, real-time, software-defined systems (SDx) for
  automotive, robotics, and other safety-critical embedded platforms. Its product
  line includes Apex.Grace (deterministic embedded execution framework, an
  automotive-grade evolution of ROS 2), Apex.Ida (high-speed fault-tolerant
  middleware for sensor, compute, and cloud connectivity), Apex.OS for V&V (data
  recording and replay for validating autonomous systems), and Apex.Alan (automated
  tooling and CI/CD workflows for safe software development at scale). Apex.AI also
  provides technical assessment, architecture, embedded and cloud software
  development, CI/CD pipeline, and ROS 1 to ROS 2 migration services. The company is
  a maintainer of substantial ROS 2 and embedded middleware open source. It is
  backed by Canaan Partners and Lightspeed Venture Partners. This profile was
  enriched by the API Evangelist pipeline; Apex.AI publishes no public developer REST
  API at this time.
